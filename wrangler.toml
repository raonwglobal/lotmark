name = "lotmark"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Unified: one Worker serves API (/api/*) + static UI (frontend/)
# run_worker_first=true → every request hits Worker first;
# src/worker.js then routes /api/* to Hono and the rest to ASSETS.
[assets]
directory = "./frontend"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Non-secret defaults. Override after first deploy if using a custom domain.
[vars]
FRONTEND_URL = "https://lotmark.fakelove-u.workers.dev"

# Secrets — never commit. Set with: npx wrangler secret put <NAME>
#   MONGODB_URI
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   STRIPE_PRICE_BASIC
#   STRIPE_PRICE_PRO
#   STRIPE_PRICE_ENTERPRISE
#   STRIPE_PRICE_DATAROOM
#   ADMIN_EMAILS

[observability]
enabled = true
