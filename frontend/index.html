<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lotmark</title>
<style>
:root{--bg:#0f1419;--card:#1a2332;--border:#2d3a4f;--text:#e7ecf3;--muted:#8b9bb4;--accent:#3b82f6;--accent-hover:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:10}
h1{margin:0;font-size:1.15rem}h1 span{color:var(--accent)}
.badge{display:inline-block;padding:.15rem .5rem;border-radius:999px;font-size:.75rem;font-weight:600;background:#1e3a5f;color:#93c5fd;text-transform:uppercase}
main{max-width:960px;margin:0 auto;padding:1.5rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.35rem}
input,select,textarea{width:100%;padding:.6rem .75rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem}
button{display:inline-flex;align-items:center;justify-content:center;padding:.55rem 1rem;border-radius:8px;border:none;font-weight:600;font-size:.9rem;cursor:pointer;background:var(--accent);color:#fff}
button:hover{background:var(--accent-hover)}button.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
button.danger{background:#b91c1c}button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:120px}
.muted{color:var(--muted);font-size:.9rem}.grade{font-weight:800;font-size:1.25rem}
.grade-A{color:#22c55e}.grade-B{color:#84cc16}.grade-C{color:#eab308}.grade-D{color:#f97316}.grade-E{color:#ef4444}
.project-list{display:grid;gap:.75rem}
.project-item{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;padding:1rem;border:1px solid var(--border);border-radius:10px;background:var(--bg);cursor:pointer}
.project-item:hover{border-color:var(--accent)}
.pricing{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.75rem}
.price-card{border:1px solid var(--border);border-radius:10px;padding:1rem;text-align:center}
.price-card.popular{border-color:var(--accent)}
.alert{padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.9rem}
.alert.ok{background:#14532d;color:#bbf7d0}.alert.err{background:#7f1d1d;color:#fecaca}
.alert.info{background:#1e3a5f;color:#bfdbfe}.alert.warn{background:#713f12;color:#fde68a}
#detail,#create-card,#admin-card,#setup-card{display:none}
#detail.visible,#create-card.visible,#admin-card.visible,#setup-card.visible{display:block}
pre{background:var(--bg);padding:.75rem;border-radius:8px;overflow:auto;font-size:.8rem;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--border)}
.secret-ok{color:#22c55e}.secret-no{color:#ef4444}.check{font-size:.9rem;margin:.35rem 0}
</style>
</head>
<body>
<header><h1><span>Lot</span>mark</h1><div id="header-user" class="muted">로딩…</div></header>
<main>
<div id="alerts"></div>
<section class="card" id="setup-card">
<h2 style="margin-top:0">초기 사이트 설정</h2>
<p class="muted">처음 한 번만 필요합니다. 관리자·사이트 옵션은 DB에 저장되며 이후 관리자만 변경할 수 있습니다.</p>
<div id="setup-infra" class="card" style="background:var(--bg);margin:1rem 0"></div>
<div class="row">
<div><label>사이트 이름</label><input id="su-name" value="Lotmark"/></div>
<div><label>관리자 이메일 *</label><input id="su-email" type="email" placeholder="admin@company.com"/></div>
</div>
<div class="row" style="margin-top:.75rem">
<div><label>공개 가입</label><select id="su-signup"><option value="true">허용</option><option value="false">비허용</option></select></div>
<div><label>기본 플랜</label><select id="su-plan"><option value="free">free</option><option value="basic">basic</option><option value="pro">pro</option></select></div>
</div>
<p class="muted" style="margin-top:.75rem">MongoDB·Stripe 시크릿은 Cloudflare Worker 시크릿으로만 설정합니다.</p>
<p style="margin-top:1rem"><button id="btn-setup">설정 완료 · 관리자 생성</button></p>
</section>
<section class="card" id="login-card" style="display:none">
<h2 style="margin-top:0">이메일 로그인</h2>
<p class="muted">계정 없으면 자동 생성(공개 가입 허용 시).</p>
<div class="row">
<div><label>Email</label><input id="email" type="email" placeholder="you@company.com"/></div>
<div style="flex:0"><label>&nbsp;</label><button id="btn-login">로그인</button></div>
</div>
</section>
<section class="card" id="pricing-card" style="display:none">
<h2 style="margin-top:0">플랜 · API</h2>
<div class="pricing">
<div class="price-card"><h3>Basic</h3><div style="font-size:1.35rem;font-weight:800;margin:.5rem 0">$199/mo</div><button data-price="basic">구독</button></div>
<div class="price-card popular"><h3>Pro</h3><div style="font-size:1.35rem;font-weight:800;margin:.5rem 0">$599/mo</div><button data-price="pro">구독</button></div>
<div class="price-card"><h3>Enterprise</h3><div style="font-size:1.35rem;font-weight:800;margin:.5rem 0">$1,500/mo</div><button data-price="enterprise">구독</button></div>
</div>
<p style="margin-top:1rem" class="row">
<button class="secondary" id="btn-portal">Portal</button>
<button class="secondary" id="btn-rotate">토큰 재발급</button>
<button class="secondary" id="btn-seed">시드</button>
<button class="secondary" id="btn-show-create">등록</button>
<button class="secondary" id="btn-show-admin" style="display:none">관리자</button>
<button class="secondary" id="btn-logout">로그아웃</button>
</p>
<p class="muted" id="token-preview"></p>
</section>
<section class="card" id="create-card">
<h2 style="margin-top:0">프로젝트 등록</h2>
<div class="row"><div><label>이름</label><input id="c-name"/></div><div><label>지역</label><input id="c-region"/></div><div><label>유형</label><input id="c-type"/></div></div>
<div class="row" style="margin-top:.75rem"><div><label>면적</label><input id="c-area" type="number"/></div><div><label>가격</label><input id="c-price" type="number"/></div><div><label>GPS</label><input id="c-gps"/></div></div>
<div class="row" style="margin-top:.75rem"><div><label>판매사</label><input id="c-seller"/></div><div><label>사업자번호</label><input id="c-tax"/></div></div>
<p style="margin-top:1rem"><button id="btn-create">저장</button> <button class="secondary" id="btn-hide-create">닫기</button></p>
</section>
<section class="card" id="admin-card">
<h2 style="margin-top:0">관리자</h2>
<h3>사이트 설정</h3>
<div class="row">
<div><label>사이트 이름</label><input id="as-name"/></div>
<div><label>공개 가입</label><select id="as-signup"><option value="true">허용</option><option value="false">비허용</option></select></div>
<div style="flex:0"><label>&nbsp;</label><button id="btn-save-settings">저장</button></div>
</div>
<div id="as-secrets" class="muted" style="margin:.75rem 0"></div>
<h3>사용자 관리</h3>
<p><button class="secondary" id="btn-users">목록 새로고침</button></p>
<div id="admin-users" style="overflow:auto"></div>
<h3>프로젝트 운영</h3>
<div class="row">
<div><label>projectId</label><input id="a-pid"/></div>
<div><label>taxCode</label><input id="a-tax"/></div>
<div style="flex:0"><label>&nbsp;</label><button class="danger" id="btn-bl">BL ON</button></div>
<div style="flex:0"><label>&nbsp;</label><button class="secondary" id="btn-bl-off">OFF</button></div>
</div>
<div class="row" style="margin-top:.75rem">
<div><label>공개 projectId</label><input id="a-vis-pid"/></div>
<div style="flex:0"><label>&nbsp;</label><button id="btn-pub">공개</button></div>
<div style="flex:0"><label>&nbsp;</label><button class="secondary" id="btn-priv">비공개</button></div>
</div>
</section>
<section class="card" id="app-main" style="display:none">
<h2 style="margin-top:0">검증 프로젝트</h2>
<div class="row" style="margin-bottom:1rem">
<div><label>지역</label><input id="f-region"/></div>
<div><label>등급</label><select id="f-grade"><option value="">전체</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select></div>
<div><label>검색</label><input id="f-search"/></div>
<div style="flex:0"><label>&nbsp;</label><button id="btn-search">조회</button></div>
</div>
<div id="project-list" class="project-list"><p class="muted">로그인 후 조회</p></div>
</section>
<section class="card" id="detail">
<h2 style="margin-top:0" id="detail-title">상세</h2>
<div id="detail-body"></div>
<p style="margin-top:1rem"><button class="secondary" id="btn-back">목록</button> <button id="btn-dataroom" style="display:none">DataRoom</button></p>
</section>
</main>
<script>
window.__API_BASE__=window.__API_BASE__||localStorage.getItem('lm_api')||'';
const $=s=>document.querySelector(s);const alerts=$('#alerts');
let currentProjectId=null,meState=null,setupStatus=null;
function showAlert(msg,type='info'){alerts.innerHTML=`<div class="alert ${type}">${msg}</div>`;setTimeout(()=>{if(alerts.innerHTML.includes(msg))alerts.innerHTML='';},8000);}
async function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};const t=localStorage.getItem('lm_token');if(t)headers.Authorization=`Bearer ${t}`;
const res=await fetch(window.__API_BASE__+path,{...options,headers});const data=await res.json().catch(()=>({}));
if(!res.ok)throw Object.assign(new Error(data.error||'요청 실패'),{status:res.status,data});return data;}
function renderSecrets(s){if(!s)return'';const row=(k,ok)=>`<div class="check"><span class="${ok?'secret-ok':'secret-no'}">${ok?'✓':'✗'}</span> ${k}</div>`;
return row('MONGODB_URI',s.mongodb)+row('STRIPE_SECRET_KEY',s.stripe)+row('STRIPE_WEBHOOK',s.stripeWebhook)+row('ADMIN_EMAILS',s.adminEmailsSecret);}
async function checkSetup(){try{setupStatus=await api('/api/setup/status');}catch(e){setupStatus={needsSetup:true,dbOk:false,message:e.message,secrets:{}};}
const needs=!!setupStatus.needsSetup;$('#setup-card').classList.toggle('visible',needs);
$('#setup-infra').innerHTML=`<p class="muted">${setupStatus.message||''}</p><p><strong>DB:</strong> ${setupStatus.dbOk?'OK':'불가'} · <strong>관리자:</strong> ${setupStatus.hasAdmin?'있음':'없음'}</p>${renderSecrets(setupStatus.secrets)}`;
if(needs){$('#login-card').style.display='none';$('#pricing-card').style.display='none';$('#app-main').style.display='none';$('#header-user').textContent='초기 설정 필요';if(setupStatus.siteName)$('#su-name').value=setupStatus.siteName;return true;}return false;}
function renderUser(me){meState=me;if(!me){$('#header-user').textContent='로그인 필요';$('#login-card').style.display='block';$('#pricing-card').style.display='none';$('#app-main').style.display='none';$('#create-card').classList.remove('visible');$('#admin-card').classList.remove('visible');return;}
$('#header-user').innerHTML=`${me.email} · <span class="badge">${me.plan}</span>${me.isAdmin?' · <span class="badge">admin</span>':''}`;
$('#login-card').style.display='none';$('#pricing-card').style.display='block';$('#app-main').style.display='block';
$('#btn-show-admin').style.display=me.isAdmin?'inline-flex':'none';$('#token-preview').textContent=me.apiTokenPreview?'토큰: '+me.apiTokenPreview:'';}
async function refreshMe(){try{const me=await api('/api/me');localStorage.setItem('lm_plan',me.plan);renderUser(me);return me;}catch{localStorage.removeItem('lm_token');renderUser(null);return null;}}
async function loadProjects(){const params=new URLSearchParams();const region=$('#f-region').value.trim(),grade=$('#f-grade').value,search=$('#f-search').value.trim();
if(region)params.set('region',region);if(grade)params.set('grade',grade);if(search)params.set('search',search);const q=params.toString();
try{const list=await api('/api/projects'+(q?`?${q}`:''));const el=$('#project-list');
if(!list.length){el.innerHTML='<p class="muted">프로젝트 없음</p>';return;}
el.innerHTML=list.map(p=>`<div class="project-item" data-id="${p.projectId}"><div class="grade grade-${p.grade||'E'}">${p.grade||'?'}</div><div><strong>${p.name||p.projectId}</strong><div class="muted">${p.region||'-'}</div></div></div>`).join('');
el.querySelectorAll('.project-item').forEach(n=>n.addEventListener('click',()=>openDetail(n.dataset.id)));}catch(e){showAlert(e.message,'err');}}
async function openDetail(id){currentProjectId=id;try{const p=await api('/api/projects/'+encodeURIComponent(id));$('#detail').classList.add('visible');$('#detail-title').textContent=p.name||p.projectId;
let html=`<p><span class="grade grade-${p.grade}">Grade ${p.grade||'?'}</span> score ${p.score??'-'}</p>`;
if(p._gated)html+=`<div class="alert info">요약만 표시</div>`;else html+=`<pre>${JSON.stringify(p,null,2)}</pre>`;
$('#detail-body').innerHTML=html;}catch(e){showAlert(e.message,'err');}}
async function startCheckout(priceKey,projectId){try{const{url}=await api('/api/checkout',{method:'POST',body:JSON.stringify({priceKey,projectId:projectId||null})});if(url)location.href=url;}catch(e){showAlert(e.message,'err');}}
async function loadUsers(){try{const users=await api('/api/admin/users');
$('#admin-users').innerHTML='<table><thead><tr><th>Email</th><th>Role</th><th>Plan</th><th></th></tr></thead><tbody>'+users.map(u=>`<tr><td>${u.email}</td><td>${u.role}${u.disabled?' disabled':''}</td><td>${u.plan}</td><td>
<button class="secondary" data-act="admin" data-email="${u.email}">Admin</button>
<button class="secondary" data-act="user" data-email="${u.email}">User</button>
<button class="secondary" data-act="disable" data-email="${u.email}">Disable</button>
<button class="secondary" data-act="enable" data-email="${u.email}">Enable</button>
<button class="danger" data-act="revoke" data-email="${u.email}">Revoke</button></td></tr>`).join('')+'</tbody></table>';
$('#admin-users').querySelectorAll('button[data-act]').forEach(btn=>btn.addEventListener('click',async()=>{const email=btn.dataset.email,act=btn.dataset.act;
try{if(act==='revoke'){await api('/api/admin/users/revoke-token',{method:'POST',body:JSON.stringify({email})});showAlert('토큰 폐기','ok');}
else{const body={email};if(act==='admin')body.role='admin';if(act==='user')body.role='user';if(act==='disable')body.disabled=true;if(act==='enable')body.disabled=false;
await api('/api/admin/users/update',{method:'POST',body:JSON.stringify(body)});showAlert('업데이트됨','ok');await loadUsers();}}catch(e){showAlert(e.message,'err');}}));}catch(e){showAlert(e.message,'err');}}
async function loadAdminSettings(){try{const s=await api('/api/admin/settings');$('#as-name').value=s.siteName||'Lotmark';$('#as-signup').value=s.allowPublicSignup===false?'false':'true';$('#as-secrets').innerHTML=renderSecrets(s.secrets);}catch{}}
$('#btn-setup').onclick=async()=>{const email=$('#su-email').value.trim();if(!email)return showAlert('관리자 이메일 필요','err');
if(!setupStatus?.dbOk)return showAlert('DB 연결 필요: MONGODB_URI 시크릿','err');
try{const data=await api('/api/setup/complete',{method:'POST',body:JSON.stringify({email,siteName:$('#su-name').value.trim()||'Lotmark',allowPublicSignup:$('#su-signup').value==='true',defaultPlan:$('#su-plan').value})});
localStorage.setItem('lm_token',data.token);localStorage.setItem('lm_email',data.email);localStorage.setItem('lm_plan',data.plan||'free');
showAlert('초기 설정 완료','ok');$('#setup-card').classList.remove('visible');renderUser({email:data.email,plan:data.plan,isAdmin:true});await loadProjects();}catch(e){showAlert(e.message,'err');}};
$('#btn-login').onclick=async()=>{const email=$('#email').value.trim();if(!email)return showAlert('이메일 입력','err');
try{const data=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email})});localStorage.setItem('lm_token',data.token);localStorage.setItem('lm_email',data.email);localStorage.setItem('lm_plan',data.plan);
showAlert('로그인','ok');renderUser(data);await loadProjects();}catch(e){if(e.data?.code==='NEEDS_SETUP'){showAlert('초기 설정 필요','warn');await checkSetup();}else showAlert(e.message,'err');}};
$('#btn-logout').onclick=()=>{['lm_token','lm_email','lm_plan'].forEach(k=>localStorage.removeItem(k));renderUser(null);};
$('#btn-search').onclick=loadProjects;$('#btn-back').onclick=()=>$('#detail').classList.remove('visible');
document.querySelectorAll('[data-price]').forEach(btn=>btn.onclick=()=>startCheckout(btn.dataset.price));
$('#btn-dataroom').onclick=()=>currentProjectId&&startCheckout('dataroom',currentProjectId);
$('#btn-portal').onclick=async()=>{try{const{url}=await api('/api/portal',{method:'POST'});if(url)location.href=url;}catch(e){showAlert(e.message,'err');}};
$('#btn-rotate').onclick=async()=>{try{const d=await api('/api/auth/rotate-token',{method:'POST'});localStorage.setItem('lm_token',d.token);showAlert('토큰 재발급','ok');await refreshMe();}catch(e){showAlert(e.message,'err');}};
$('#btn-seed').onclick=async()=>{try{const r=await api('/api/seed',{method:'POST'});showAlert('시드 '+(r.created?.length||0)+'건','ok');await loadProjects();}catch(e){showAlert(e.message,'err');}};
$('#btn-show-create').onclick=()=>$('#create-card').classList.add('visible');$('#btn-hide-create').onclick=()=>$('#create-card').classList.remove('visible');
$('#btn-show-admin').onclick=async()=>{$('#admin-card').classList.toggle('visible');if($('#admin-card').classList.contains('visible')){await loadAdminSettings();await loadUsers();}};
$('#btn-users').onclick=loadUsers;
$('#btn-save-settings').onclick=async()=>{try{await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({siteName:$('#as-name').value.trim(),allowPublicSignup:$('#as-signup').value==='true'})});showAlert('설정 저장','ok');}catch(e){showAlert(e.message,'err');}};
$('#btn-create').onclick=async()=>{try{const body={name:$('#c-name').value.trim(),region:$('#c-region').value.trim(),type:$('#c-type').value.trim(),areaSqm:Number($('#c-area').value)||undefined,priceUsd:Number($('#c-price').value)||undefined,gps:{raw:$('#c-gps').value.trim()},sellerCompany:{name:$('#c-seller').value.trim(),taxCode:$('#c-tax').value.trim()}};
const created=await api('/api/projects',{method:'POST',body:JSON.stringify(body)});showAlert('등록 '+created.projectId,'ok');$('#create-card').classList.remove('visible');await loadProjects();}catch(e){showAlert(e.message,'err');}};
$('#btn-bl').onclick=async()=>{try{await api('/api/admin/blacklist',{method:'POST',body:JSON.stringify({projectId:$('#a-pid').value.trim(),taxCode:$('#a-tax').value.trim(),blacklist:true})});showAlert('BL ON','ok');}catch(e){showAlert(e.message,'err');}};
$('#btn-bl-off').onclick=async()=>{try{await api('/api/admin/blacklist',{method:'POST',body:JSON.stringify({projectId:$('#a-pid').value.trim(),taxCode:$('#a-tax').value.trim(),blacklist:false})});showAlert('BL OFF','ok');}catch(e){showAlert(e.message,'err');}};
$('#btn-pub').onclick=async()=>{try{await api('/api/admin/visibility',{method:'POST',body:JSON.stringify({projectId:$('#a-vis-pid').value.trim(),isPublic:true})});showAlert('공개','ok');}catch(e){showAlert(e.message,'err');}};
$('#btn-priv').onclick=async()=>{try{await api('/api/admin/visibility',{method:'POST',body:JSON.stringify({projectId:$('#a-vis-pid').value.trim(),isPublic:false})});showAlert('비공개','ok');}catch(e){showAlert(e.message,'err');}};
(async()=>{const needs=await checkSetup();if(needs)return;if(localStorage.getItem('lm_token')){await refreshMe();await loadProjects();}else renderUser(null);})();
</script>
</body>
</html>
