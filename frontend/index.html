<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>V-Verify — 베트남 프로젝트 검증</title>
  <style>
    :root {
      --bg: #0f1419; --card: #1a2332; --border: #2d3a4f; --text: #e7ecf3;
      --muted: #8b9bb4; --accent: #3b82f6; --accent-hover: #2563eb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--card); position: sticky; top: 0; z-index: 10; }
    header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
    header h1 span { color: var(--accent); }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: #1e3a5f; color: #93c5fd; text-transform: uppercase; }
    main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
    input, select, textarea { width: 100%; padding: 0.6rem 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1rem; }
    textarea { min-height: 72px; resize: vertical; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem; padding: 0.55rem 1rem; border-radius: 8px; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; background: var(--accent); color: #fff; }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button.secondary:hover { border-color: var(--accent); color: var(--accent); }
    button.danger { background: #b91c1c; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: end; }
    .row > * { flex: 1; min-width: 120px; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .grade { font-weight: 800; font-size: 1.25rem; }
    .grade-A { color: #22c55e; } .grade-B { color: #84cc16; } .grade-C { color: #eab308; } .grade-D { color: #f97316; } .grade-E { color: #ef4444; }
    .project-list { display: grid; gap: 0.75rem; }
    .project-item { display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: center; padding: 1rem; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); cursor: pointer; }
    .project-item:hover { border-color: var(--accent); }
    .pricing { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; }
    .price-card { border: 1px solid var(--border); border-radius: 10px; padding: 1rem; text-align: center; }
    .price-card.popular { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .price-card h3 { margin: 0 0 0.25rem; }
    .price-card .amount { font-size: 1.35rem; font-weight: 800; margin: 0.5rem 0; }
    .alert { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
    .alert.ok { background: #14532d; color: #bbf7d0; }
    .alert.err { background: #7f1d1d; color: #fecaca; }
    .alert.info { background: #1e3a5f; color: #bfdbfe; }
    #detail, #create-card, #admin-card { display: none; }
    #detail.visible, #create-card.visible, #admin-card.visible { display: block; }
    pre { background: var(--bg); padding: 0.75rem; border-radius: 8px; overflow: auto; font-size: 0.8rem; border: 1px solid var(--border); }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .tabs button.active { background: var(--accent-hover); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>
  <header>
    <h1><span>V</span>-Verify</h1>
    <div id="header-user" class="muted">로그인 필요</div>
  </header>

  <main>
    <div id="alerts"></div>

    <section class="card" id="login-card">
      <h2 style="margin-top:0">이메일 로그인</h2>
      <p class="muted">계정 없으면 자동 생성. 토큰 기반 MVP.</p>
      <div class="row">
        <div><label>Email</label><input id="email" type="email" placeholder="you@company.com" /></div>
        <div style="flex:0"><label>&nbsp;</label><button id="btn-login">로그인</button></div>
      </div>
      <p class="muted" style="margin-top:0.75rem">API Base: <code id="api-base-label"></code> · localStorage <code>vv_api</code> 로 변경 가능</p>
    </section>

    <section class="card" id="pricing-card" style="display:none">
      <h2 style="margin-top:0">플랜 · API</h2>
      <div class="pricing">
        <div class="price-card"><h3>Basic</h3><div class="amount">$199/mo</div><button data-price="basic">구독</button></div>
        <div class="price-card popular"><h3>Pro</h3><div class="amount">$599/mo</div><button data-price="pro">구독</button></div>
        <div class="price-card"><h3>Enterprise</h3><div class="amount">$1,500/mo</div><button data-price="enterprise">구독</button></div>
      </div>
      <p style="margin-top:1rem" class="row">
        <button class="secondary" id="btn-portal">Stripe Portal</button>
        <button class="secondary" id="btn-rotate">API 토큰 재발급 (Pro+)</button>
        <button class="secondary" id="btn-seed">샘플 시드</button>
        <button class="secondary" id="btn-show-create">프로젝트 등록</button>
        <button class="secondary" id="btn-show-admin" style="display:none">관리자</button>
        <button class="secondary" id="btn-logout">로그아웃</button>
      </p>
      <p class="muted" id="token-preview"></p>
    </section>

    <section class="card" id="create-card">
      <h2 style="margin-top:0">프로젝트 등록</h2>
      <div class="row">
        <div><label>이름</label><input id="c-name" /></div>
        <div><label>지역</label><input id="c-region" placeholder="HCMC" /></div>
        <div><label>유형</label><input id="c-type" placeholder="industrial" /></div>
      </div>
      <div class="row" style="margin-top:0.75rem">
        <div><label>면적 m²</label><input id="c-area" type="number" /></div>
        <div><label>가격 USD</label><input id="c-price" type="number" /></div>
        <div><label>GPS (lat,lng)</label><input id="c-gps" placeholder="10.85, 106.75" /></div>
      </div>
      <div class="row" style="margin-top:0.75rem">
        <div><label>판매사</label><input id="c-seller" /></div>
        <div><label>사업자번호</label><input id="c-tax" /></div>
      </div>
      <div style="margin-top:0.75rem"><label>출처 (JSON 배열, 선택)</label>
        <textarea id="c-sources" placeholder='[{"docType":"IRC","fileUrl":"https://...","trustScore":90,"isOfficial":true}]'></textarea>
      </div>
      <p style="margin-top:1rem">
        <button id="btn-create">저장 · 자동 등급</button>
        <button class="secondary" id="btn-hide-create">닫기</button>
      </p>
    </section>

    <section class="card" id="admin-card">
      <h2 style="margin-top:0">관리자</h2>
      <p class="muted">ADMIN_EMAILS 시크릿에 포함된 계정만 접근 가능</p>
      <div class="row">
        <div><label>projectId</label><input id="a-pid" /></div>
        <div><label>taxCode</label><input id="a-tax" /></div>
        <div style="flex:0"><label>&nbsp;</label><button class="danger" id="btn-bl">블랙리스트 ON</button></div>
        <div style="flex:0"><label>&nbsp;</label><button class="secondary" id="btn-bl-off">OFF</button></div>
      </div>
      <div class="row" style="margin-top:0.75rem">
        <div><label>공개 여부 projectId</label><input id="a-vis-pid" /></div>
        <div style="flex:0"><label>&nbsp;</label><button id="btn-pub">공개</button></div>
        <div style="flex:0"><label>&nbsp;</label><button class="secondary" id="btn-priv">비공개</button></div>
        <div style="flex:0"><label>&nbsp;</label><button class="secondary" id="btn-users">사용자 목록</button></div>
      </div>
      <div id="admin-out" style="margin-top:1rem"></div>
    </section>

    <section class="card">
      <h2 style="margin-top:0">검증 프로젝트</h2>
      <div class="row" style="margin-bottom:1rem">
        <div><label>지역</label><input id="f-region" placeholder="HCMC" /></div>
        <div><label>등급</label><select id="f-grade"><option value="">전체</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select></div>
        <div><label>검색</label><input id="f-search" placeholder="프로젝트명" /></div>
        <div style="flex:0"><label>&nbsp;</label><button id="btn-search">조회</button></div>
      </div>
      <div id="project-list" class="project-list"><p class="muted">로그인 후 조회하세요.</p></div>
    </section>

    <section class="card" id="detail">
      <h2 style="margin-top:0" id="detail-title">상세</h2>
      <div id="detail-body"></div>
      <div class="card" style="margin-top:1rem; background: var(--bg)">
        <h3 style="margin-top:0">출처 추가</h3>
        <div class="row">
          <div><label>docType</label>
            <select id="s-type">
              <option>IRC</option><option>ERC</option><option>LURC</option><option>DPI_PORTAL</option>
              <option>FIELD_PHOTO</option><option>GOV_DOC</option><option>NEWS</option><option>SELLER_DOC</option>
            </select>
          </div>
          <div><label>fileUrl</label><input id="s-url" placeholder="https://..." /></div>
          <div><label>trustScore</label><input id="s-trust" type="number" value="70" /></div>
          <div style="flex:0"><label>공식</label><select id="s-off"><option value="true">yes</option><option value="false">no</option></select></div>
        </div>
        <p style="margin-top:0.75rem"><button id="btn-add-source">출처 추가 · 재등급</button></p>
      </div>
      <p style="margin-top:1rem">
        <button class="secondary" id="btn-back">목록으로</button>
        <button id="btn-dataroom" style="display:none">DataRoom $99</button>
      </p>
    </section>
  </main>

  <script>
    window.__API_BASE__ = window.__API_BASE__ || localStorage.getItem('vv_api') || 'https://v-verify-api.your-subdomain.workers.dev';
    document.getElementById('api-base-label').textContent = window.__API_BASE__;

    const $ = (s) => document.querySelector(s);
    const alerts = $('#alerts');
    let currentProjectId = null;
    let meState = null;

    function showAlert(msg, type = 'info') {
      alerts.innerHTML = `<div class="alert ${type}">${msg}</div>`;
      setTimeout(() => { if (alerts.innerHTML.includes(msg)) alerts.innerHTML = ''; }, 7000);
    }

    async function api(path, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      const t = localStorage.getItem('vv_token');
      if (t) headers['Authorization'] = `Bearer ${t}`;
      const res = await fetch(window.__API_BASE__ + path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw Object.assign(new Error(data.error || '요청 실패'), { status: res.status, data });
      return data;
    }

    function renderUser(me) {
      meState = me;
      if (!me) {
        $('#header-user').textContent = '로그인 필요';
        $('#login-card').style.display = 'block';
        $('#pricing-card').style.display = 'none';
        $('#create-card').classList.remove('visible');
        $('#admin-card').classList.remove('visible');
        return;
      }
      $('#header-user').innerHTML = `${me.email} · <span class="badge">${me.plan}</span>${me.isAdmin ? ' · <span class="badge">admin</span>' : ''}`;
      $('#login-card').style.display = 'none';
      $('#pricing-card').style.display = 'block';
      $('#btn-show-admin').style.display = me.isAdmin ? 'inline-flex' : 'none';
      $('#token-preview').textContent = me.apiTokenPreview ? '토큰: ' + me.apiTokenPreview : '';
    }

    async function refreshMe() {
      try {
        const me = await api('/api/me');
        localStorage.setItem('vv_plan', me.plan);
        renderUser(me);
        return me;
      } catch {
        localStorage.removeItem('vv_token');
        renderUser(null);
        return null;
      }
    }

    async function loadProjects() {
      const params = new URLSearchParams();
      const region = $('#f-region').value.trim();
      const grade = $('#f-grade').value;
      const search = $('#f-search').value.trim();
      if (region) params.set('region', region);
      if (grade) params.set('grade', grade);
      if (search) params.set('search', search);
      const q = params.toString();
      try {
        const list = await api('/api/projects' + (q ? `?${q}` : ''));
        const el = $('#project-list');
        if (!list.length) {
          el.innerHTML = '<p class="muted">프로젝트 없음. 「샘플 시드」 또는 「프로젝트 등록」을 사용하세요.</p>';
          return;
        }
        el.innerHTML = list.map(p => `
          <div class="project-item" data-id="${p.projectId}">
            <div class="grade grade-${p.grade || 'E'}">${p.grade || '?'}</div>
            <div><strong>${p.name || p.projectId}</strong>
              <div class="muted">${p.region || '-'} · ${p.type || '-'} ${p._gated ? '· <em>요약</em>' : ''}</div></div>
            <div class="muted">${p.priceUsd != null ? '$' + Number(p.priceUsd).toLocaleString() : ''}</div>
          </div>`).join('');
        el.querySelectorAll('.project-item').forEach(n => n.addEventListener('click', () => openDetail(n.dataset.id)));
      } catch (e) { showAlert(e.message, 'err'); }
    }

    async function openDetail(id) {
      currentProjectId = id;
      try {
        const p = await api('/api/projects/' + encodeURIComponent(id));
        $('#detail').classList.add('visible');
        $('#detail-title').textContent = p.name || p.projectId;
        const gated = p._gated || p._upgradeRequired;
        let html = `<p><span class="grade grade-${p.grade}">Grade ${p.grade || '?'}</span>
          ${p.gradeReason ? `<span class="muted"> — ${p.gradeReason}</span>` : ''} · score ${p.score ?? '-'}</p>`;
        if (gated) {
          html += `<div class="alert info">무료는 요약만. Basic 이상 구독 시 전체 표시.</div>`;
          $('#btn-dataroom').style.display = 'none';
        } else {
          html += `<pre>${JSON.stringify(p, null, 2)}</pre>`;
          const needsDR = (p.sources || []).some(s => s._dataRoomRequired);
          $('#btn-dataroom').style.display = needsDR ? 'inline-flex' : 'none';
        }
        $('#detail-body').innerHTML = html;
        window.scrollTo({ top: $('#detail').offsetTop - 60, behavior: 'smooth' });
      } catch (e) { showAlert(e.message, 'err'); }
    }

    async function startCheckout(priceKey, projectId) {
      try {
        const { url } = await api('/api/checkout', { method: 'POST', body: JSON.stringify({ priceKey, projectId: projectId || null }) });
        if (url) location.href = url; else showAlert('Checkout URL 없음', 'err');
      } catch (e) { showAlert(e.message || 'Checkout 실패', 'err'); }
    }

    $('#btn-login').addEventListener('click', async () => {
      const email = $('#email').value.trim();
      if (!email) return showAlert('이메일을 입력하세요', 'err');
      try {
        const data = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email }) });
        localStorage.setItem('vv_token', data.token);
        localStorage.setItem('vv_email', data.email);
        localStorage.setItem('vv_plan', data.plan);
        showAlert('로그인 · ' + data.plan + (data.isAdmin ? ' · admin' : ''), 'ok');
        renderUser(data);
        await loadProjects();
      } catch (e) { showAlert(e.message, 'err'); }
    });

    $('#btn-logout').addEventListener('click', () => {
      ['vv_token','vv_email','vv_plan'].forEach(k => localStorage.removeItem(k));
      renderUser(null);
      $('#project-list').innerHTML = '<p class="muted">로그인 후 조회하세요.</p>';
      $('#detail').classList.remove('visible');
    });

    $('#btn-search').addEventListener('click', loadProjects);
    $('#btn-back').addEventListener('click', () => $('#detail').classList.remove('visible'));
    document.querySelectorAll('[data-price]').forEach(btn => btn.addEventListener('click', () => startCheckout(btn.dataset.price)));
    $('#btn-dataroom').addEventListener('click', () => currentProjectId && startCheckout('dataroom', currentProjectId));

    $('#btn-portal').addEventListener('click', async () => {
      try { const { url } = await api('/api/portal', { method: 'POST' }); if (url) location.href = url; }
      catch (e) { showAlert(e.message, 'err'); }
    });

    $('#btn-rotate').addEventListener('click', async () => {
      try {
        const data = await api('/api/auth/rotate-token', { method: 'POST' });
        localStorage.setItem('vv_token', data.token);
        showAlert('새 토큰 발급됨. 이전 토큰 무효.', 'ok');
        await refreshMe();
      } catch (e) { showAlert(e.message, 'err'); }
    });

    $('#btn-seed').addEventListener('click', async () => {
      try {
        const r = await api('/api/seed', { method: 'POST' });
        showAlert('시드 ' + r.created.length + '건: ' + r.created.map(x => x.projectId + '(' + x.grade + ')').join(', '), 'ok');
        await loadProjects();
      } catch (e) { showAlert(e.message, 'err'); }
    });

    $('#btn-show-create').addEventListener('click', () => $('#create-card').classList.add('visible'));
    $('#btn-hide-create').addEventListener('click', () => $('#create-card').classList.remove('visible'));
    $('#btn-show-admin').addEventListener('click', () => $('#admin-card').classList.toggle('visible'));

    $('#btn-create').addEventListener('click', async () => {
      let sources = [];
      const raw = $('#c-sources').value.trim();
      if (raw) {
        try { sources = JSON.parse(raw); } catch { return showAlert('출처 JSON 파싱 실패', 'err'); }
      }
      const body = {
        name: $('#c-name').value.trim(),
        region: $('#c-region').value.trim(),
        type: $('#c-type').value.trim(),
        areaSqm: Number($('#c-area').value) || undefined,
        priceUsd: Number($('#c-price').value) || undefined,
        gps: { raw: $('#c-gps').value.trim() },
        sellerCompany: { name: $('#c-seller').value.trim(), taxCode: $('#c-tax').value.trim(), blacklist: false },
        sources,
        isPublic: true,
      };
      if (!body.name) return showAlert('이름 필수', 'err');
      try {
        const p = await api('/api/projects', { method: 'POST', body: JSON.stringify(body) });
        showAlert('생성 ' + p.projectId + ' · Grade ' + p.grade, 'ok');
        $('#create-card').classList.remove('visible');
        await loadProjects();
        openDetail(p.projectId);
      } catch (e) { showAlert(e.message, 'err'); }
    });

    $('#btn-add-source').addEventListener('click', async () => {
      if (!currentProjectId) return;
      const src = {
        docType: $('#s-type').value,
        fileUrl: $('#s-url').value.trim(),
        trustScore: Number($('#s-trust').value) || 50,
        isOfficial: $('#s-off').value === 'true',
      };
      try {
        const r = await api('/api/projects/' + encodeURIComponent(currentProjectId) + '/sources', {
          method: 'POST', body: JSON.stringify({ sources: [src] }),
        });
        showAlert('재등급 ' + r.grade + ' (score ' + r.score + ')', 'ok');
        openDetail(currentProjectId);
        loadProjects();
      } catch (e) { showAlert(e.message, 'err'); }
    });

    async function doBlacklist(flag) {
      try {
        const r = await api('/api/admin/blacklist', {
          method: 'POST',
          body: JSON.stringify({ projectId: $('#a-pid').value.trim() || undefined, taxCode: $('#a-tax').value.trim() || undefined, blacklist: flag }),
        });
        $('#admin-out').innerHTML = '<pre>' + JSON.stringify(r, null, 2) + '</pre>';
        showAlert('블랙리스트 반영', 'ok');
        loadProjects();
      } catch (e) { showAlert(e.message, 'err'); }
    }
    $('#btn-bl').addEventListener('click', () => doBlacklist(true));
    $('#btn-bl-off').addEventListener('click', () => doBlacklist(false));

    async function doVis(isPublic) {
      try {
        const r = await api('/api/admin/visibility', {
          method: 'POST',
          body: JSON.stringify({ projectId: $('#a-vis-pid').value.trim(), isPublic }),
        });
        $('#admin-out').innerHTML = '<pre>' + JSON.stringify(r, null, 2) + '</pre>';
        loadProjects();
      } catch (e) { showAlert(e.message, 'err'); }
    }
    $('#btn-pub').addEventListener('click', () => doVis(true));
    $('#btn-priv').addEventListener('click', () => doVis(false));

    $('#btn-users').addEventListener('click', async () => {
      try {
        const users = await api('/api/admin/users');
        $('#admin-out').innerHTML = '<table><tr><th>email</th><th>plan</th><th>status</th><th>role</th></tr>' +
          users.map(u => `<tr><td>${u.email}</td><td>${u.plan}</td><td>${u.subscriptionStatus}</td><td>${u.role || 'user'}</td></tr>`).join('') + '</table>';
      } catch (e) { showAlert(e.message, 'err'); }
    });

    const params = new URLSearchParams(location.search);
    if (params.get('checkout') === 'success') {
      showAlert('결제 완료. 웹훅 반영 후 새로고침하세요.', 'ok');
      history.replaceState({}, '', location.pathname);
    } else if (params.get('checkout') === 'cancel') {
      showAlert('결제 취소', 'info');
      history.replaceState({}, '', location.pathname);
    }

    (async () => {
      if (localStorage.getItem('vv_token')) {
        await refreshMe();
        await loadProjects();
      }
    })();
  </script>
</body>
</html>
